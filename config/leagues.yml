# League configuration for the league-specific draft sheets.
#
# Add a league by appending an entry under `leagues:` -- no code changes needed.
# Each configured league becomes one worksheet in the generated draft workbook,
# in the order listed here (the `data_dictionary` sheet always comes last).
#
# Required fields per league:
#   league_name     display name; also the Excel sheet name (Excel truncates to
#                   31 chars and forbids  []  :  *  ?  /  \  which are stripped)
#   num_teams       number of teams / draft slots
#   draft_position  YOUR snake-draft slot, an integer from 1..num_teams. Drives
#                   which rows get highlighted (every pick where that slot is on
#                   the clock, following the forward/reverse snake order).
#   managers        ordered list of manager names = round-1 pick order. The list
#                   length MUST equal num_teams. Names must not be blank.
#
# Optional field per league:
#   draft_platform  draft host, one of: espn | sleeper. Default: sleeper.
#                   Only "espn" changes behaviour: that league's sheet is
#                   ordered by the curated ESPN draft-room order (`espn_order`,
#                   from data/manual/), with unknown-order players kept in
#                   checkpoint order after the known block. All snake-draft
#                   context columns (pick / round / manager) are assigned AFTER
#                   that reordering. Non-espn leagues keep the shared checkpoint
#                   order exactly.
#   keepers         list of {manager, player_name, prior_draft_round}. Omit the
#                   key or use [] for a league with no keepers. Rules:
#                     - manager must exactly match one of this league's managers
#                     - at most one keeper per manager
#                     - prior_draft_round is an integer >= 2
#                     - player_name must exactly match one checkpoint player
#                   Effect: keeper_round = prior_draft_round - 1; on that league
#                   sheet the manager's consumed pick cell (in keeper_round) and
#                   the kept player's name cell are blacked out. Other leagues
#                   are unaffected -- the player stays draftable there.
#
# Placeholder names below are safe to hand-edit later. "You" marks the slot that
# matches `draft_position` purely as a convenience; renaming it changes nothing.

# EXAMPLE CONFIGURATION (commented out) -- copy/paste and edit to add your own leagues
# leagues:
#   - league_name: "EXAMPLE LEAGUE"
#     num_teams: 12
#     draft_position: 3
#     managers:
#       - "Manager 01"
#       - "Manager 02"
#       - "Manager 03"
#       - "Manager 04"
#       - "Manager 05"
#       - "Manager 06"
#       - "Manager 07"
#       - "Manager 08"
#       - "Manager 09"
#       - "Manager 10"
#       - "Manager 11"
#       - "Manager 12"
#     keepers:
#       - manager: "Manager 03"
#         player_name: "Javonte Williams"
#         prior_draft_round: 8
#       - manager: "Manager 08"
#         player_name: "Tony Pollard"
#         prior_draft_round: 6


